; Loaded after the distribution pool and overrides only resource settings.
[www]
user = www-data
group = www-data
listen = @PHP_SOCKET@
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 10s
pm.max_requests = 500
request_terminate_timeout = 120s
catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php
