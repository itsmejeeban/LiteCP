; Loaded after the distribution pool and overrides only resource settings.
[www]
user = nginx
group = nginx
listen = @PHP_SOCKET@
listen.mode = 0660
listen.acl_users = nginx
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 10s
pm.max_requests = 500
request_terminate_timeout = 120s
catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php
