[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[litecp_health]
user = www-data
group = www-data
listen = /run/litecp-php73/health.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 300
request_terminate_timeout = 120s
catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php
php_admin_value[open_basedir] = /var/empty/litecp:/tmp
